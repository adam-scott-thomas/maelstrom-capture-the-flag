[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maelstrom-ctf"
version = "1.0.0"
description = "Break the Bot -- adversarial tool-surface injection CTF powered by Maelstrom Gate"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Adam Scott Thomas"}]
keywords = ["ai", "safety", "ctf", "adversarial", "governance", "tool-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
server = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "pydantic>=2.0"]
gate = ["maelstrom-gate>=0.1.0"]

[project.urls]
Homepage = "https://github.com/adam-scott-thomas/maelstrom-capture-the-flag"
Repository = "https://github.com/adam-scott-thomas/maelstrom-capture-the-flag"

[tool.setuptools.packages.find]
include = ["ctf*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
